name: Deskly checks
on: [push, pull_request]
jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskly
          POSTGRES_PASSWORD: deskly
          POSTGRES_DB: deskly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskly -d deskly_test"
          --health-interval 5s --health-timeout 4s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://deskly:deskly@127.0.0.1:5432/deskly_test
      DESKLY_TEST_DATABASE_URL: postgresql+psycopg://deskly:deskly@127.0.0.1:5432/deskly_test
      APP_ORIGIN: http://localhost:3000
      SAMPLE_CATALOGUE: "true"
      CASH_ON_DELIVERY: "true"
      SEED_ADMIN_EMAIL: admin@deskly-ci.example.com
      PLAYWRIGHT_ADMIN_EMAIL: admin@deskly-ci.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: |
          deskly_admin_password=$(openssl rand -hex 20)
          {
            echo "SEED_ADMIN_PASSWORD=$deskly_admin_password"
            echo "PLAYWRIGHT_ADMIN_PASSWORD=$deskly_admin_password"
          } >> "$GITHUB_ENV"
      - run: alembic upgrade head && alembic check && python -m pytest -q && python -m deskly.seed
        working-directory: backend
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock --strict
      - run: npm ci && npm audit --omit=dev && npm run test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          (cd backend && uvicorn deskly.main:app --port 8000 --no-access-log) &
          (cd frontend && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/ &&
            HOSTNAME=localhost PORT=3000 node .next/standalone/server.js) &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:3000 > /dev/null && curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          npm --prefix frontend run test:e2e
