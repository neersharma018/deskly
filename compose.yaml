name: deskly
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deskly
      POSTGRES_USER: deskly
      POSTGRES_PASSWORD: deskly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskly -d deskly"]
      interval: 3s
      timeout: 4s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 4s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://deskly:deskly@postgres:5432/deskly
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && python -m deskly.seed"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://deskly:deskly@postgres:5432/deskly
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://deskly:deskly@postgres:5432/deskly
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "deskly.worker"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
